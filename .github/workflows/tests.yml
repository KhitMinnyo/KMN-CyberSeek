name: Offline Regression Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      AI_PROVIDER: none
      SCOPE_ALLOWLIST: ""
      KMN_EXECUTION_BACKEND: local
      FULL_AUTO_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Offline Test Dependencies
        run: >-
          python -m pip install
          pytest==8.3.5 pytest-asyncio==0.25.3
          fastapi==0.104.1 "httpx>=0.25.2,<0.28"
          "pydantic>=2.9,<3" "cryptography>=41"
          requests python-dotenv
      - name: Run Regression and HTTP Contract Tests
        run: python -m pytest -q -ra -o asyncio_default_fixture_loop_scope=function
      - name: Check Patch Whitespace
        run: git diff --check
